name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Policies, Terraform and secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check every policy file is valid JSON
        run: for f in policies/*.json; do jq empty "$f" && echo "valid JSON: $f"; done

      - name: Check no access keys or console passwords are created in code
        run: |
          if grep -rnE 'aws_iam_access_key|aws_iam_user_login_profile' terraform/; then
            echo "Developers must not get access keys or a password from Terraform." && exit 1
          fi
          echo "no access keys or login profiles in terraform/"

      - name: Terraform fmt, validate and tests (mocked AWS provider)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/terraform --entrypoint sh hashicorp/terraform:1.17.1 -c
          "terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate && terraform test"

      - name: Lint with TFLint
        run: docker run --rm -v "$PWD:/repo" -w /repo/terraform ghcr.io/terraform-linters/tflint:v0.66.0 --format compact

      - name: Scan with Checkov
        run: >-
          docker run --rm -v "$PWD:/repo" bridgecrew/checkov:3.4.3
          -d /repo/terraform --framework terraform --quiet --compact

      - name: Scan with Trivy
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 config --quiet --exit-code 1 /repo/terraform

      - name: Scan the history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git --redact --no-banner /repo
